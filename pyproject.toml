[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightweight-classification-app"
version = "0.2.0"
description = "Lightweight Windows classification banner and enforcement service"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
service = ["pywin32>=306; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
include = ["classification_app*"]
